<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="viewport-fit=cover,width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Slippy — Traccia le spese</title>
<meta name="description" content="Fotografa gli scontrini, traccia le spese e analizzale con AI. Completamente privato, funziona offline."/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0F0F11" media="(prefers-color-scheme: dark)"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Slippy"/>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#007AFF;--accent-end:#5E5CE6;
  --green:#34C759;--orange:#FF9500;--red:#FF3B30;
  --purple:#AF52DE;--fuel:#FF6B00;--indigo:#5856D6;
  --gray:#8E8E93;
  --bg:#F2F2F7;--card:#FFFFFF;
  --lbl:#1C1C1E;--lbl2:rgba(60,60,67,.52);--lbl3:rgba(60,60,67,.2);
  --sep:rgba(60,60,67,.09);--fill:rgba(120,120,128,.1);--fill2:rgba(120,120,128,.18);
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,0px);
  --tbh:56px;--r:16px;
  --hero-a:#141E30;--hero-b:#243B55;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.07);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0F0F11;--card:#1C1C1E;
  --lbl:#F5F5F7;--lbl2:rgba(235,235,245,.52);--lbl3:rgba(235,235,245,.2);
  --sep:rgba(235,235,245,.1);--fill:rgba(120,120,128,.18);--fill2:rgba(120,120,128,.28);
  --sh:none;
}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--lbl);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;font-size:16px}
#app{position:fixed;inset:0}

/* VIEWS */
@keyframes vfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.view{position:absolute;inset:0 0 calc(var(--tbh) + var(--sb)) 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);display:none}
.view.on{display:block;animation:vfade .22s cubic-bezier(.4,0,.2,1)}

/* OVERLAYS — transform-based, no display:none */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:200;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  pointer-events:none}
.overlay.on{transform:translateX(0);pointer-events:auto}

/* NAV */
.nav{position:sticky;top:0;z-index:50;
  padding:calc(var(--st) + 14px) 20px 12px;background:var(--bg)}
.nav h1{font-size:30px;font-weight:700;letter-spacing:-.6px}

.nav-row{display:flex;align-items:center;gap:8px;
  padding:calc(var(--st)+10px) 16px 10px;
  position:sticky;top:0;z-index:50;background:var(--bg)}
.nav-row h2{font-size:16px;font-weight:600;flex:1;text-align:center}
.back-btn,.nav-act{background:none;border:none;color:var(--accent);
  font-size:16px;cursor:pointer;padding:6px;display:flex;align-items:center;
  gap:2px;font-family:inherit;min-width:56px}
.nav-act{font-weight:600;justify-content:flex-end}

/* TABBAR */
#tabbar{position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tbh) + var(--sb));
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  display:flex;align-items:flex-start;padding:8px 0 0;z-index:100}
@media(prefers-color-scheme:dark){#tabbar{background:rgba(22,22,24,.85)}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--lbl3);
  font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;
  padding:0;letter-spacing:.05em;text-transform:uppercase;transition:color .15s}
.tab.on{color:var(--accent)}
.tab-ico{width:28px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;transition:transform .18s,background .18s}
.tab.on .tab-ico{transform:scale(1.08);background:rgba(0,122,255,.12)}
.tab-ico svg{width:22px;height:22px;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:currentColor}

/* FAB */
#fab{position:fixed;left:50%;bottom:calc(var(--tbh) + var(--sb) + 14px);
  transform:translateX(-50%);width:54px;height:54px;border-radius:27px;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  color:#fff;border:none;cursor:pointer;z-index:101;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,122,255,.42),0 2px 6px rgba(94,92,230,.28);
  transition:transform .12s,box-shadow .12s}
#fab:active{transform:translateX(-50%) scale(.88);box-shadow:0 2px 8px rgba(0,122,255,.28)}
#fab svg{width:20px;height:20px;stroke:#fff;stroke-width:2.5;stroke-linecap:round;fill:none}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  animation:cardin .32s cubic-bezier(.25,0,.4,1) both}

/* SPEND CARD — dark gradient hero */
.spend-card{
  text-align:center;padding:20px 20px 22px;margin:8px 16px 0;
  background:linear-gradient(145deg,var(--hero-a) 0%,var(--hero-b) 100%);
  position:relative;overflow:hidden}
.spend-card::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(94,92,230,.12);pointer-events:none}
/* month row embedded in card */
.spend-mrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.spend-mrow button{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.75);
  width:30px;height:30px;border-radius:9px;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
  transition:background .12s}
.spend-mrow button:disabled{color:rgba(255,255,255,.2);background:transparent;cursor:default}
.spend-mrow button:not(:disabled):active{background:rgba(255,255,255,.22)}
.spend-mrow span{font-size:13px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.02em}
/* amount typography */
.s-lbl{font-size:9px;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.s-amt{font-size:52px;font-weight:700;color:#fff;letter-spacing:-2.5px;line-height:1.05;
  margin:6px 0 4px;font-variant-numeric:tabular-nums}
.s-delta{font-size:12px;font-weight:500;margin-bottom:2px}
.s-stats{display:flex;border-top:.5px solid rgba(255,255,255,.12);margin-top:16px;padding-top:14px}
.sp{flex:1;text-align:center}
.sp+.sp{border-left:.5px solid rgba(255,255,255,.12)}
.sp-v{font-size:16px;font-weight:700;color:#fff}
.sp-l{font-size:9px;color:rgba(255,255,255,.45);margin-top:3px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.spend-share-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);
  border:none;border-radius:20px;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:6px 14px;margin:14px auto 0;
  transition:background .15s,color .15s}
.spend-share-btn:active{background:rgba(255,255,255,.16);color:#fff}

/* MONTH PICKER (fallback standalone — kept for compat) */
.mpick{display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;margin:10px 16px 0;background:var(--card);border-radius:var(--r)}
.mpick button{background:none;border:none;color:var(--accent);
  font-size:20px;cursor:pointer;padding:0;width:32px;text-align:center;line-height:1}
.mpick button:disabled{color:var(--lbl3);cursor:default}
.mpick span{font-size:14px;font-weight:600}

/* CHART */
.chart-card{margin:10px 16px 0;padding:18px 16px 14px}
.chart-title{font-size:10px;font-weight:700;color:var(--lbl2);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:11px;
  border-radius:8px;transition:background .12s;margin:-2px -6px 11px;padding:2px 6px}
.brow:active{background:var(--fill)}
.bico{font-size:13px;width:20px;text-align:center}
.bnm{font-size:12px;width:74px;color:var(--lbl);overflow:hidden;white-space:nowrap;font-weight:500}
.btrk{flex:1;height:7px;background:var(--fill);border-radius:4px;overflow:hidden}
.bfll{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bval{font-size:11px;color:var(--lbl2);width:52px;text-align:right;font-weight:600}

/* LIST */
.sec{margin:0 16px 8px}
.sec-hdr{font-size:10px;font-weight:700;color:var(--lbl2);
  padding:12px 4px 6px;text-transform:uppercase;letter-spacing:.07em;
  display:flex;justify-content:space-between;align-items:center}
.sec-total{font-size:11px;font-weight:700;color:var(--lbl2);font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
.sec-list{overflow:hidden;border-radius:var(--r)}
.lrow{display:flex;align-items:center;gap:13px;padding:13px 14px;
  background:var(--card);border-bottom:.5px solid var(--sep);cursor:pointer;
  transition:background .12s,transform .1s;position:relative;z-index:1}
.lrow:active{background:var(--fill);transform:scale(.985)}

/* SWIPE-TO-DELETE */
.rx-wrap{position:relative;overflow:hidden}
.rx-del-btn{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--red);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:0}
.rx-del-btn span{color:#fff;font-size:13px;font-weight:600}
.sec-list .rx-wrap:first-child .lrow{border-radius:var(--r) var(--r) 0 0}
.sec-list .rx-wrap:last-child .lrow{border-radius:0 0 var(--r) var(--r);border-bottom:none}
.sec-list .rx-wrap:only-child .lrow{border-radius:var(--r);border-bottom:none}

.ico-box{width:44px;height:44px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ri{flex:1;min-width:0}
.rn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--lbl2);margin-top:1px}
.ra{font-size:15px;font-weight:700}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:80px 32px;text-align:center}
.empty-ico{font-size:60px;opacity:.18}
.empty h3{font-size:20px;font-weight:700}
.empty p{font-size:14px;color:var(--lbl2);line-height:1.6;max-width:260px}

/* FORMS */
.fsec{margin:0 16px 4px}
.fhdr{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;
  letter-spacing:.07em;padding:14px 4px 6px}
.frow{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);padding:13px 16px;border-bottom:.5px solid var(--sep)}
.frow:first-of-type{border-radius:var(--r) var(--r) 0 0}
.frow:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:none}
.frow:only-child{border-radius:var(--r);border-bottom:none}
.flbl{font-size:15px;flex-shrink:0;min-width:80px;color:var(--lbl)}
.finp{background:none;border:none;outline:none;text-align:right;
  font-size:15px;color:var(--accent);font-family:inherit;flex:1;min-width:0;padding-left:8px}
.finp::placeholder{color:var(--lbl3)}
select.finp{-webkit-appearance:none;cursor:pointer}
.qa-row{display:flex;gap:6px;padding:8px 0 4px;flex-wrap:wrap;background:var(--card);
  border-radius:0 0 var(--r) var(--r);padding:8px 14px 10px;margin:0}
.qa-chip{flex:1;min-width:44px;padding:7px 4px;border-radius:10px;border:.5px solid var(--sep);
  background:var(--fill);font-size:13px;font-weight:600;color:var(--accent);
  cursor:pointer;font-family:inherit;transition:background .12s,transform .1s}
.qa-chip:active{background:var(--fill2);transform:scale(.93)}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% - 32px);margin:0 16px;padding:15px;border-radius:var(--r);
  font-size:16px;font-weight:600;border:none;cursor:pointer;
  font-family:inherit;transition:opacity .1s,transform .1s;letter-spacing:-.1px}
.btn:active{opacity:.75;transform:scale(.98)}
.btn-p{background:var(--accent);color:#fff}
.btn-d{background:rgba(255,59,48,.1);color:var(--red)}
.btn-s{background:var(--fill);color:var(--accent)}

/* SCANNER */
.scan-pick{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:60px 32px;text-align:center;min-height:62vh}
.scan-pick-ico{font-size:68px;opacity:.85}
.scan-btns{display:flex;flex-direction:column;gap:10px;width:100%}
.processing{display:flex;flex-direction:column;align-items:center;
  gap:24px;padding:60px 32px;text-align:center}
.proc-ring{width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,122,255,.15) 0%,rgba(94,92,230,.15) 100%);
  display:flex;align-items:center;justify-content:center;
  animation:proc-pulse 1.6s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(0,122,255,.3)}
@keyframes proc-pulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,122,255,.25)}
  50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(0,122,255,0)}
}
.proc-ico{font-size:40px;line-height:1}
.proc-steps{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;text-align:left}
.proc-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lbl2);
  opacity:.45;transition:opacity .4s,color .4s}
.proc-step.done{opacity:1;color:var(--lbl)}
.proc-dot{width:8px;height:8px;border-radius:50%;background:var(--fill2);flex-shrink:0;
  transition:background .4s,transform .3s}
.proc-step.done .proc-dot{background:var(--green);transform:scale(1.2)}
.img-thumb{width:100%;max-width:300px;max-height:220px;object-fit:contain;
  border-radius:12px;margin:0 auto;display:block}

/* DETAIL */
.det-hero{margin:12px 16px 0;padding:20px 20px 18px;border-radius:var(--r);
  background:linear-gradient(155deg,#141E30 0%,color-mix(in srgb,var(--cat,#243B55) 45%,#0d1117) 120%);
  position:relative;overflow:hidden}
@supports not (color: color-mix(in srgb, red 50%, blue)){
  .det-hero{background:linear-gradient(145deg,var(--hero-a) 0%,var(--hero-b) 100%)}
}
.det-hero::before{content:'';position:absolute;top:-50px;right:-50px;
  width:200px;height:200px;border-radius:50%;
  background:var(--cat,#007AFF);opacity:.18;pointer-events:none}
.det-hero::after{content:'';position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:var(--cat,#007AFF);opacity:.08;pointer-events:none}
.det-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative}
.det-hero-ico{width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0}
.det-hero-store{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.det-hero-cat{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.det-hero-amt{font-size:42px;font-weight:800;color:#fff;letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;line-height:1;margin-bottom:10px;position:relative}
.det-hero-date{font-size:12px;color:rgba(255,255,255,.5);position:relative}
.det-hero-thumb{position:absolute;right:16px;bottom:16px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.det-sec{margin:12px 16px 0}
.det-sec h3{font-size:10px;font-weight:700;color:var(--lbl2);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.irow{display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;border-bottom:.5px solid var(--sep)}
.irow:last-child{border-bottom:none}
.in{font-size:14px}.ia{font-size:14px;font-weight:600;color:var(--lbl2)}

/* SPINNER */
@keyframes _spin{to{transform:rotate(360deg)}}
.spin{border:2.5px solid var(--fill2);border-top-color:var(--accent);border-radius:50%;
  animation:_spin .7s linear infinite}

/* AI */
.ai-card{margin:12px 16px 0;padding:18px}
.ai-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-hdr h3{font-size:14px;font-weight:700;flex:1}
.ai-badge{background:linear-gradient(135deg,#FF6B6B,#FF9500);color:#fff;
  font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;
  letter-spacing:.06em;text-transform:uppercase}
.ai-tip{font-size:14px;line-height:1.65;color:var(--lbl)}
.ai-btn{background:none;border:none;color:var(--accent);font-size:13px;
  font-weight:600;cursor:pointer;font-family:inherit}
.ai-regen-btn{background:none;border:none;color:var(--lbl2);font-size:12px;
  font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px;
  display:block;padding:0;opacity:.7}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0}
.chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;
  border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;
  background:var(--fill);color:var(--lbl);transition:all .15s}
.chip.sel{color:#fff}

/* SETTINGS */
.ssel{margin:0 16px 20px}
.sshdr{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;
  letter-spacing:.07em;padding:16px 4px 7px}
.srow{display:flex;align-items:center;background:var(--card);
  padding:14px 16px;border-bottom:.5px solid var(--sep);gap:12px}
.srow:first-of-type{border-radius:var(--r) var(--r) 0 0}
.srow:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:none}
.srow:only-child{border-radius:var(--r);border-bottom:none}
.slbl{font-size:15px;flex-shrink:0;flex:1}
.sval{font-size:15px;color:var(--lbl2);text-align:right;flex-shrink:0}
.si-row{padding:12px 16px}
.si-ico{width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.kinp{flex:1;background:none;border:none;outline:none;
  font-size:13px;font-family:'Menlo','SF Mono',monospace;color:var(--accent);
  text-align:right;padding:0}
.kinp::placeholder{color:var(--lbl3);font-family:inherit}
.snote{font-size:12px;color:var(--lbl2);padding:6px 4px 0;line-height:1.55}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--tbh) + var(--sb) + 20px);left:50%;
  transform:translateX(-50%) translateY(12px);background:var(--lbl);
  color:var(--bg);padding:10px 20px;border-radius:22px;font-size:13px;
  font-weight:500;z-index:999;opacity:0;
  transition:all .28s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pad{height:24px}

/* SEARCH */
.search-wrap{padding:8px 16px 4px;position:relative}
.search-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;pointer-events:none;color:var(--lbl2)}
.search-inp{width:100%;background:var(--fill);border:none;border-radius:12px;
  padding:10px 38px 10px 38px;font-size:15px;color:var(--lbl);font-family:inherit;outline:none}
.search-inp::placeholder{color:var(--lbl2)}
.search-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);
  background:var(--fill2);border:none;border-radius:50%;width:18px;height:18px;
  font-size:10px;color:var(--lbl2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;line-height:1;padding:0}

/* BOTTOM SHEET */
.sbd{position:fixed;inset:0;background:transparent;z-index:290;pointer-events:none;transition:background .3s}
.sbd.on{background:rgba(0,0,0,.45);pointer-events:auto}
.sht{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:22px 22px 0 0;
  z-index:300;transform:translateY(110%);transition:transform .38s cubic-bezier(.32,1.08,.4,1);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  max-height:85dvh;overflow-y:auto}
.sht.on{transform:translateY(0)}
.sht-knob{width:36px;height:4px;background:var(--fill2);border-radius:2px;margin:12px auto 8px}

/* CALENDAR HEATMAP */
.cal-wrap{margin:10px 16px 0;padding:14px 16px 16px;background:var(--card);border-radius:var(--r)}
.cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-title{font-size:11px;font-weight:700;color:var(--lbl2);text-transform:uppercase;letter-spacing:.07em}
.cal-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--lbl2)}
.cal-legend-dot{width:10px;height:10px;border-radius:3px;background:var(--accent);opacity:.6}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dname{font-size:9px;font-weight:700;color:var(--lbl2);text-align:center;padding:2px 0 4px}
.cal-cell{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;
  background:var(--fill2);display:flex;align-items:center;justify-content:center}
.cal-cell:not(.cal-empty):not(.cal-future):active{transform:scale(.92);transition:transform .1s}
.cal-fill{position:absolute;inset:0;border-radius:5px}
.cal-n{position:relative;font-size:9px;font-weight:600;color:var(--lbl2);line-height:1;z-index:1}
.cal-n.cal-has-amt{color:var(--lbl);font-weight:700}
.cal-empty{background:transparent}
.cal-future{opacity:.35}
.cal-today .cal-n{color:#fff;font-weight:800}
.cal-today::before{content:'';position:absolute;inset:0;border:2px solid var(--accent);border-radius:5px;z-index:2}
.cal-today .cal-fill{background:var(--accent)!important;opacity:.85!important}

/* BUDGET */
.budget-wrap{margin:10px 16px 0;padding:16px;background:var(--card);border-radius:var(--r);
  display:flex;align-items:center;gap:16px;border-left:3px solid var(--accent)}
.budget-ring{width:90px;height:90px;flex-shrink:0;
  transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.budget-info{flex:1;min-width:0}
.budget-lbl{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;letter-spacing:.07em}
.budget-remain{font-size:15px;font-weight:700;margin-top:4px;margin-bottom:2px}
.budget-meta{font-size:12px;color:var(--lbl2)}

/* INSIGHTS */
.insight-wrap{margin:10px 16px 0;padding:16px;background:var(--card);border-radius:var(--r)}
.insight-hdr{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.insight-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:.5px solid var(--sep)}
.insight-row:last-child{border-bottom:none;padding-bottom:0}
.insight-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.insight-ico{width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.insight-txt{font-size:13px;line-height:1.55;color:var(--lbl)}

/* SPARKLINE */
.spark-wrap{margin:10px 16px 0;padding:16px;background:var(--card);border-radius:var(--r)}
.spark-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.spark-title{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;letter-spacing:.07em}

/* WEEK SUMMARY */
.week-wrap{margin:10px 16px 0;padding:14px 16px;background:var(--card);border-radius:var(--r);
  border-left:3px solid var(--accent-end,var(--accent))}
.week-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.week-lbl{font-size:10px;font-weight:700;color:var(--lbl2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.week-amt{font-size:24px;font-weight:700;color:var(--lbl);letter-spacing:-.5px}
.week-delta-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.wd-bars{display:flex;gap:4px;height:56px;align-items:flex-end}
.wd-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wd-bar-wrap{flex:1;display:flex;align-items:flex-end;width:100%}
.wd-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;
  transition:height .45s cubic-bezier(.4,0,.2,1)}
.wd-lbl{font-size:9px;color:var(--lbl2);letter-spacing:.01em}

/* CATEGORY FILTER */
.filter-bar-row{display:flex;align-items:center;padding-right:16px}
.filter-wrap{display:flex;gap:7px;padding:8px 0 4px 16px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-width:0}
.filter-wrap::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:6px 12px;border-radius:20px;border:.5px solid var(--sep);
  background:var(--card);color:var(--lbl);font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;gap:4px}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-cnt{font-size:10px;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
.sort-btn{flex-shrink:0;padding:5px 10px;border-radius:20px;border:.5px solid var(--sep);
  background:var(--card);font-size:12px;font-weight:600;color:var(--accent);
  cursor:pointer;font-family:inherit;white-space:nowrap;margin-top:2px}

/* RECURRING BADGE */
.freq-badge{display:inline-flex;align-items:center;background:var(--fill2);
  color:var(--lbl2);font-size:9px;font-weight:700;padding:1px 5px;
  border-radius:6px;margin-left:5px;vertical-align:middle;letter-spacing:.02em}

/* NOTE PIP */
.note-pip{font-size:10px;opacity:.6}

/* RECEIPT THUMBNAIL IN LIST */
.rx-thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0}

/* STREAK BADGE */
.streak-badge{font-size:14px;font-weight:700;color:var(--orange);letter-spacing:-.3px}

/* BRANDED DASHBOARD HEADER */
.brand-nav{display:flex;justify-content:space-between;align-items:center}
.brand-row{display:flex;align-items:center;gap:8px}
.brand-ico-wrap{width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,122,255,.38)}
.brand-ico{color:#fff;font-size:17px;font-weight:800;letter-spacing:-.5px;font-style:italic;line-height:1}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.8px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-end) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* FORECAST CARD */
.forecast-card{margin:10px 16px 0;padding:16px 18px;
  border-left:3px solid var(--accent)}
.forecast-lbl{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;color:var(--lbl2);margin-bottom:6px}
.forecast-main{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.forecast-amt{font-size:28px;font-weight:700;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.forecast-rate{font-size:14px;font-weight:600;color:var(--lbl2);font-variant-numeric:tabular-nums}
.forecast-rate span{font-size:11px;font-weight:500}
.forecast-sub{font-size:13px;color:var(--lbl2);line-height:1.4}

/* RECEIPTS MONTH TOTAL */
.rx-month-total{font-size:14px;font-weight:600;color:var(--lbl2)}

/* SHARE BUTTON */
.share-btn{width:34px;height:34px;padding:0;
  display:flex;align-items:center;justify-content:center}

/* AI MONTHLY CARD */
.ai-month-card{margin:10px 16px 0;padding:18px}

/* RESULT COUNT */
.result-count{font-size:12px;color:var(--lbl2);padding:4px 16px 0;font-weight:500}

/* IMAGE FULLSCREEN */
.img-ov{position:fixed;inset:0;background:#000;z-index:400;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s}
.img-ov.on{opacity:1;pointer-events:auto}

/* DETAIL NOTE */
.det-note{margin:8px 16px 0;padding:12px 16px;background:var(--card);
  border-radius:var(--r);font-size:14px;color:var(--lbl2);line-height:1.6;
  display:flex;align-items:flex-start;gap:8px}
.det-note-ico{font-size:15px;flex-shrink:0;margin-top:1px}

/* ANIMATED CATEGORY BARS */
@keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bfll{transform-origin:left;animation:barin .45s cubic-bezier(.2,0,.4,1) both}

/* TOP STORES CARD */
.top-stores-card{margin:10px 16px 0;padding:16px 18px}
.ts-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--lbl2);margin-bottom:10px}
.ts-row{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-radius:8px;transition:background .12s;margin:0 -8px;padding-left:8px;padding-right:8px}
.ts-row+.ts-row{border-top:.5px solid var(--sep)}
.ts-row:active{background:var(--fill)}
.ts-medal{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.ts-ico{font-size:18px;flex-shrink:0}
.ts-info{flex:1;min-width:0}
.ts-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-meta{font-size:12px;color:var(--lbl2)}
.ts-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}

/* YEARLY SECTION */
.yearly-card{margin:10px 16px 0;padding:16px 18px}
.yearly-hdr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--lbl2);margin-bottom:12px}
.yearly-stats{display:flex;align-items:stretch;gap:0;background:var(--bg2);border-radius:12px;overflow:hidden;margin-bottom:12px}
.ys-item{flex:1;padding:12px 8px;text-align:center}
.ys-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lbl)}
.ys-lbl{font-size:11px;color:var(--lbl2);margin-top:2px}
.ys-divider{width:.5px;background:var(--sep);flex-shrink:0}
.yearly-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;color:var(--lbl)}
.yearly-row+.yearly-row{border-top:.5px solid var(--sep)}
.yearly-row span{color:var(--lbl2)}
.yearly-row strong{font-weight:700}

/* ONBOARDING / WELCOME SCREEN */
.welcome-wrap{padding:24px 16px 0;display:flex;flex-direction:column;gap:16px}
.welcome-hero{text-align:center;padding:32px 16px 24px}
.welcome-ico-wrap{width:72px;height:72px;border-radius:22px;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  box-shadow:0 8px 32px rgba(0,122,255,.35)}
.welcome-ico{color:#fff;font-size:38px;font-weight:900;letter-spacing:-.5px;
  font-style:italic;line-height:1}
.welcome-title{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
.welcome-sub{font-size:16px;color:var(--lbl2);line-height:1.5}
.welcome-steps{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ws-row{display:flex;align-items:flex-start;gap:12px;font-size:15px;color:var(--lbl);line-height:1.4}
.ws-num{width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.welcome-cta{width:calc(100% - 32px);margin:0 16px;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  color:#fff;font-size:16px;font-weight:700;letter-spacing:-.2px;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,122,255,.4)}
.welcome-hint{text-align:center;font-size:13px;color:var(--lbl2);padding:0 16px;line-height:1.5}

/* NUDGE CARDS */
.nudge-card{margin:10px 16px 0;padding:14px 16px;display:flex;align-items:center;gap:12px;
  cursor:pointer;border-left:3px solid var(--accent);transition:opacity .15s}
.nudge-card:active{opacity:.7}
.nudge-ico{font-size:22px;flex-shrink:0;width:34px;text-align:center}
.nudge-body{flex:1;min-width:0}
.nudge-title{font-size:14px;font-weight:700;color:var(--lbl);margin-bottom:2px}
.nudge-sub{font-size:12px;color:var(--lbl2);line-height:1.4}
.nudge-arr{font-size:18px;color:var(--lbl3);flex-shrink:0}

/* SETTINGS BRAND FOOTER */
.settings-brand{text-align:center;padding:28px 16px 8px;display:flex;
  flex-direction:column;align-items:center;gap:6px}
.settings-brand-ico{width:48px;height:48px;border-radius:14px;
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 100%);
  display:flex;align-items:center;justify-content:center;margin-bottom:2px;
  color:#fff;font-size:24px;font-weight:900;font-style:italic;line-height:1;
  box-shadow:0 4px 16px rgba(0,122,255,.3)}
.settings-brand-name{font-size:18px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-end) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.settings-brand-tag{font-size:12px;color:var(--lbl2);letter-spacing:.1px}
</style>
</head>
<body>
<div id="app">
  <div id="vd" class="view on"></div>
  <div id="vr" class="view"></div>
  <div id="vs" class="view"></div>
  <div id="oscanner" class="overlay"></div>
  <div id="odetail"  class="overlay"></div>
  <div id="oimg" class="img-ov"></div>

  <div id="sbd" class="sbd" onclick="closeSheet()"></div>
  <div id="sht" class="sht">
    <div class="sht-knob"></div>
    <div id="sht-body"></div>
  </div>

  <nav id="tabbar">
    <button class="tab on" onclick="gotoTab('d')">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="12" width="4" height="9" rx="1"/>
          <rect x="10" y="7"  width="4" height="14" rx="1"/>
          <rect x="17" y="3"  width="4" height="18" rx="1"/>
        </svg>
      </span>
      <span>Dashboard</span>
    </button>
    <button class="tab" onclick="gotoTab('r')">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24">
          <path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-3 2-3-2-3 2V3a1 1 0 0 1 1-1z"/>
          <line x1="9" y1="9"  x2="15" y2="9"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
        </svg>
      </span>
      <span>Scontrini</span>
    </button>
    <button class="tab" onclick="gotoTab('s')">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </span>
      <span>Impostazioni</span>
    </button>
  </nav>

  <button id="fab" onclick="openScanner()" aria-label="Aggiungi scontrino">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <input type="file" id="filein" accept="image/*" capture="environment" style="display:none"/>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
